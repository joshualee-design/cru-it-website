name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stage only the public site files. This is a plain static site with
      # no build step, but the repo also holds .claude/ (skills, agents,
      # hooks, commands) and .github/ (this workflow) — those are project
      # tooling, not part of the published website, so they're deliberately
      # left out of the deploy artifact.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html styles.css script.js robots.txt sitemap.xml _site/
          cp -r assets _site/assets
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
